<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#059669" />
  <title>플래너 코치 · 학생</title>
  <link rel="manifest" href="manifest-student.json" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { padding-bottom: 24px; }
    .auth-box { max-width: 420px; margin: 40px auto; }
    .status-pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .st-submitted { background: #dbeafe; color: #1d4ed8; }
    .st-analyzing, .st-analyzed { background: #fef3c7; color: #b45309; }
    .st-sent { background: #d1fae5; color: #047857; }
    .st-failed { background: #fee2e2; color: #b91c1c; }
    .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .list-row:last-child { border-bottom: none; }
    .list-main { flex: 1; min-width: 0; }
    .list-title { font-weight: 700; font-size: 14px; }
    .list-sub { font-size: 12.5px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .new-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; margin-left: 6px; vertical-align: middle; }
    .progress-bar { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .progress-bar > div { height: 100%; background: var(--emerald); border-radius: 999px; }
    .viewer { position: fixed; inset: 0; background: rgba(15,23,42,.85); z-index: 60; display: none; flex-direction: column; }
    .viewer-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; }
    .viewer-body { flex: 1; overflow: auto; padding: 0 10px 20px; }
    .viewer-body img { width: 100%; border-radius: 12px; display: block; }
    .muted { font-size: 13px; color: var(--text-sub); margin: 6px 0 0; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-top">
        <div>
          <h1 class="app-title">플래너 코치 · 학생</h1>
          <p class="app-subtitle" id="stuSubtitle">로그인해 주세요</p>
        </div>
        <button class="btn btn-ghost" id="btnLogout" style="display:none;">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 로그인 -->
    <section id="loginSection" class="card auth-box" style="display:none;">
      <h2 class="card-title" style="margin-bottom:12px;">🔐 학생 로그인</h2>
      <div class="field">
        <label for="loginId">아이디</label>
        <input type="text" id="loginId" autocomplete="username" autocapitalize="none" placeholder="선생님이 알려 준 아이디" />
      </div>
      <div class="field">
        <label for="loginPw">비밀번호</label>
        <input type="password" id="loginPw" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-full" id="btnLogin">로그인</button>
      <p class="muted" id="loginMsg"></p>
    </section>

    <div id="appSection" style="display:none; flex-direction:column; gap:14px;">
      <!-- 제출 -->
      <section class="card">
        <div class="card-title-row">
          <h2 class="card-title">📷 오늘 플래너 보내기</h2>
        </div>
        <div class="field">
          <label for="inputPlanDate">플래너 날짜</label>
          <input type="date" id="inputPlanDate" />
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btnCamera">📷 촬영</button>
          <button class="btn btn-outline" id="btnGallery">🖼️ 사진 선택</button>
        </div>
        <input type="file" id="inputCamera" accept="image/*" capture="environment" hidden />
        <input type="file" id="inputGallery" accept="image/*" hidden />
        <div class="photo-preview-box" id="previewBox" style="display:none; margin-top:10px;">
          <img id="previewImg" alt="플래너 사진 미리보기" />
        </div>
        <div class="field" style="margin-top:10px;">
          <label for="inputMemo">선생님께 한마디 (선택)</label>
          <input type="text" id="inputMemo" placeholder="예: 오늘 수학 오답을 많이 했어요" />
        </div>
        <button class="btn btn-emerald btn-full" id="btnSubmit" disabled>📤 선생님께 보내기</button>
      </section>

      <!-- 받은 리포트 -->
      <section class="card">
        <div class="card-title-row">
          <h2 class="card-title">📬 받은 리포트</h2>
          <button class="btn btn-ghost" id="btnRefresh">🔄 새로고침</button>
        </div>
        <div id="reportList"><p class="muted">아직 받은 리포트가 없어요.</p></div>
      </section>

      <!-- 교재 진도 -->
      <section class="card">
        <div class="card-title-row">
          <h2 class="card-title">📚 교재별 진도</h2>
        </div>
        <div id="progressList"><p class="muted">리포트가 쌓이면 교재별 진도가 자동으로 기록돼요.</p></div>
      </section>

      <!-- 이번 주 습관 -->
      <section class="card">
        <div class="card-title-row">
          <h2 class="card-title">🎯 이번 주 플래너 습관</h2>
        </div>
        <div id="habitList"><p class="muted">이번 주 기록이 아직 없어요.</p></div>
      </section>

      <!-- 보낸 사진 -->
      <section class="card">
        <div class="card-title-row">
          <h2 class="card-title">🗂️ 내가 보낸 플래너</h2>
        </div>
        <div id="submissionList"><p class="muted">보낸 플래너가 없어요.</p></div>
      </section>
    </div>
  </main>

  <div class="viewer" id="viewer">
    <div class="viewer-head">
      <strong id="viewerTitle">리포트</strong>
      <button class="btn btn-outline" id="btnCloseViewer" style="padding:6px 12px;">닫기</button>
    </div>
    <div class="viewer-body">
      <p id="viewerLoading" style="color:#fff;">리포트를 그리는 중...</p>
      <img id="viewerImg" alt="리포트" />
      <p style="color:#cbd5e1; font-size:12.5px; text-align:center;">사진을 길게 누르면 저장할 수 있어요.</p>
    </div>
  </div>

  <div class="toast" id="toastBox"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="mccheyne-map.js"></script>
  <script src="app.js"></script>
  <script src="student.js"></script>
</body>
</html>
